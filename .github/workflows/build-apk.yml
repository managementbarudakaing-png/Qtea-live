name: Build QTEA LIVE APK V4.2 FINAL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter 3.19.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Force fix pubspec.yaml name FIRST
        run: |
          echo "BEFORE:"
          cat pubspec.yaml | head -3
          sed -i 's/^name:.*/name: qtea_live/' pubspec.yaml
          echo "AFTER:"
          cat pubspec.yaml | head -3

      - name: Fix Android project if missing
        run: |
          if [ ! -d "android" ]; then
            echo "Android missing - creating in /tmp and copying"
            rm -rf /tmp/qtea_temp
            flutter create /tmp/qtea_temp --platforms=android --project-name qtea_live --org com.barudakaing.qtealive
            cp -r /tmp/qtea_temp/android ./
            ls android/
          else
            echo "Android exists"
          fi

      - name: Get packages
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QTEA-LIVE-V4.2-FINAL-60-15-25-APK
          path: build/app/outputs/flutter-apk/app-release.apk
