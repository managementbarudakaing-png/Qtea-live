name: Build QTEA LIVE APK V4.2 FINAL - Host 60% Agency 15% Platform 25%

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter 3.19.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build APK Release (QTEA LIVE V4.2 - No Interstitial)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QTEA-LIVE-V4.2-FINAL-60-15-25-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
